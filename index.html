<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Modo claro / oscuro">☀️ Modo claro</button>

  <h1 class="title">TETRIS</h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- récords al terminar la partida -->
        <div id="gameover-records" class="records-box hidden">
          <div id="record-entry" class="record-entry hidden">
            <label for="record-name">¡Nuevo récord! Tu nombre:</label>
            <div class="record-entry-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
              <button id="record-save" type="button">Guardar</button>
            </div>
          </div>
          <div id="gameover-table"></div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- pantalla de inicio con la tabla de récords -->
    <div id="start-screen" class="overlay">
      <div class="overlay-box records-box">
        <p class="start-title">RÉCORDS</p>
        <div id="start-table"></div>
        <div class="records-stats">
          <span>Mejor combo: <strong id="best-combo">0</strong></span>
          <span>Máx. líneas: <strong id="max-lines">0</strong></span>
        </div>
        <button id="play-btn" type="button">Jugar</button>
        <p class="start-hint">o pulsa <kbd>Space</kbd> / <kbd>Enter</kbd></p>
        <button id="clear-records-btn" class="link-btn" type="button">Borrar récords</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
